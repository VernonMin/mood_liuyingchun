<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心情月报 · 刘迎春</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-snap-type: y mandatory; overflow-y: scroll; height: 100%; }
body { font-family: 'Noto Serif SC', 'PingFang SC', serif; }

/* ── Loading ── */
#loading {
  position: fixed; inset: 0;
  background: #1a100c;
  display: flex; align-items: center; justify-content: center;
  z-index: 200; color: #c4a882; font-size: 13px; letter-spacing: 3px;
}
.dot { display: inline-block; animation: blink 1.4s ease-in-out infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100%{opacity:.15} 40%{opacity:1} }

/* ── Month Nav ── */
#monthNav {
  position: fixed; top: 20px; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center; gap: 14px;
  z-index: 100; pointer-events: none;
}
.nav-btn {
  pointer-events: all;
  border-radius: 50%; width: 30px; height: 30px; font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  border: 1px solid rgba(245,232,216,0.2); background: transparent;
  color: rgba(245,232,216,0.4); transition: all 0.3s;
}
.nav-btn:hover:not(:disabled) { color: rgba(245,232,216,0.8); }
.nav-btn:disabled { opacity: 0.12; cursor: default; }
#navLabel {
  font-size: 11px; letter-spacing: 2px; min-width: 90px;
  text-align: center; color: rgba(245,232,216,0.35);
  pointer-events: none; transition: color 0.4s;
}

/* ── Scroll Dots ── */
#scrollDots {
  position: fixed; right: 14px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px; z-index: 100;
}
.s-dot {
  width: 4px; height: 4px; border-radius: 50%; cursor: pointer;
  transition: all 0.3s; background: rgba(245,232,216,0.18);
}
.s-dot.active { background: rgba(245,232,216,0.65); transform: scale(1.6); }

/* ── Sections ── */
.section {
  scroll-snap-align: start; min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 80px 32px 52px; position: relative;
}
.s-dark     { background: #1a100c; }
.s-mid-dark { background: #1f1208; }
.s-warm     { background: #fdf8ee; }
.s-warm-alt { background: #f9f3e8; }
.s-insight  { background: #f0e6d4; }
.s-paper    { background: #fffcf5; justify-content: flex-start; }

/* ── Fade animations ── */
.fu { opacity: 0; transform: translateY(20px); transition: opacity 0.75s ease, transform 0.75s ease; }
.fu.in { opacity: 1; transform: translateY(0); }
.fu.d1 { transition-delay: 0.15s; }
.fu.d2 { transition-delay: 0.30s; }
.fu.d3 { transition-delay: 0.45s; }

/* ── Shared ── */
.sec-label { font-size: 11px; letter-spacing: 3px; margin-bottom: 24px; text-align: center; }
.s-dark .sec-label, .s-mid-dark .sec-label { color: rgba(245,232,216,0.28); }
.s-warm .sec-label, .s-warm-alt .sec-label, .s-insight .sec-label, .s-paper .sec-label { color: #c4a882; }

/* ── S1 Opener ── */
.open-year  { font-size:11px; color:rgba(245,232,216,.28); letter-spacing:7px; margin-bottom:16px; font-weight:300; text-align:center; }
.open-month { font-size:68px; color:#f5e8d8; font-weight:300; letter-spacing:10px; line-height:1; margin-bottom:28px; text-align:center; }
.open-sub   { font-size:12px; color:rgba(245,232,216,.3); letter-spacing:3px; text-align:center; }
.scroll-hint {
  position:absolute; bottom:30px; font-size:10px;
  color:rgba(245,232,216,.16); letter-spacing:3px;
  animation: breathe 2.8s ease-in-out infinite;
}
@keyframes breathe { 0%,100%{opacity:.4} 50%{opacity:1} }

/* ── S2 Number + Mood merged ── */
.merged-num-wrap { display:flex; align-items:baseline; justify-content:center; gap:6px; margin-bottom:6px; }
.merged-num  { font-size:72px; color:#c4756a; font-family:'Playfair Display',serif; font-style:italic; font-weight:300; line-height:1; }
.merged-unit { font-size:15px; color:#c4a882; letter-spacing:3px; }
.merged-sub  { font-size:11px; color:#c4b098; letter-spacing:1px; margin-bottom:26px; text-align:center; }
.mood-grid { display:flex; flex-wrap:wrap; gap:10px 12px; justify-content:center; max-width:300px; margin:0 auto 22px; }
.mood-cell  { display:flex; flex-direction:column; align-items:center; gap:3px; }
.mood-cell-emoji { font-size:22px; }
.mood-cell-day   { font-size:9px; color:#c4b098; }
.mood-summary-text { font-size:13px; color:#8a6058; letter-spacing:.5px; margin-bottom:8px; text-align:center; }
.mood-count-row  { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
.mood-count-pill { font-size:11px; color:#c4b098; }

/* ── S3 Best Day ── */
.best-pre        { font-size:10px; color:rgba(245,232,216,.25); letter-spacing:4px; margin-bottom:18px; text-align:center; }
.best-date       { font-size:13px; color:rgba(245,232,216,.42); letter-spacing:4px; margin-bottom:16px; text-align:center; }
.best-emoji      { font-size:58px; display:block; margin-bottom:22px; text-align:center; }
.best-quote      { font-size:15px; color:rgba(245,232,216,.62); line-height:1.9; font-style:italic; max-width:260px; text-align:center; }
.best-quote-note { font-size:10px; color:rgba(245,232,216,.2); letter-spacing:1.5px; margin-top:12px; text-align:center; }

/* ── S4 Insight ── */
.insight-pre    { font-size:10px; color:rgba(160,120,90,.5); letter-spacing:4px; margin-bottom:20px; text-align:center; }
.insight-big    { font-size:48px; color:#b86a5a; font-family:'Playfair Display',serif; font-style:italic; font-weight:300; line-height:1.15; text-align:center; margin-bottom:16px; max-width:280px; }
.insight-detail { font-size:13px; color:#a07860; letter-spacing:.5px; text-align:center; line-height:1.8; max-width:240px; }

/* ── S5 Jar ── */
.jar-wrap { width:100%; max-width:320px; }
.jar-list { display:flex; flex-direction:column; gap:26px; }
.jar-item-text { font-size:15px; color:#7a5850; line-height:1.85; font-style:italic; margin-bottom:5px; }
.jar-item-date { font-size:10px; color:#c4b098; letter-spacing:1px; }

/* ── S6 Letter ── */
.letter-inner { width:100%; max-width:340px; padding-top:8px; }
.letter-cap   { font-size:11px; color:#c4a882; letter-spacing:3px; margin-bottom:22px; }
.letter-body  { font-size:15px; color:#8a6058; line-height:2.1; white-space:pre-line; }

/* ── S7 Close ── */
.close-line1 { font-size:16px; color:#c4a882; letter-spacing:1px; margin-bottom:14px; font-weight:300; text-align:center; }
.close-line2 { font-size:32px; color:#c4756a; letter-spacing:2px; font-weight:500; text-align:center; }
.regen-btn {
  position:absolute; bottom:30px;
  background:none; border:1px solid rgba(196,149,106,.18); border-radius:20px;
  padding:5px 18px; font-size:10px; color:rgba(196,168,130,.32);
  cursor:pointer; font-family:inherit; letter-spacing:1px; transition:all .2s;
}
.regen-btn:hover { color:#c4756a; border-color:rgba(196,149,106,.4); }

/* ── S8 截图卡 ── */
.s-sharecard { background: #1a100c; }
.sharecard-wrap {
  width: 290px;
  background: linear-gradient(160deg, #fdf6ec 0%, #f7ead8 100%);
  border-radius: 22px;
  padding: 34px 26px 26px;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}
.sc-header {
  font-size: 10px;
  color: rgba(160,120,90,0.5);
  letter-spacing: 4px;
  margin-bottom: 4px;
  text-align: center;
}
.sc-month {
  font-size: 30px;
  color: #2a1810;
  font-weight: 300;
  letter-spacing: 4px;
  margin-bottom: 22px;
  text-align: center;
}
.sc-quote-wrap {
  width: 100%;
  border-left: 2px solid rgba(196,149,106,0.38);
  padding-left: 14px;
  margin-bottom: 20px;
}
.sc-quote-text {
  font-size: 13px;
  color: #6a4040;
  line-height: 1.9;
  font-style: italic;
  word-break: keep-all;
  overflow-wrap: break-word;
}
.sc-quote-date {
  font-size: 9px;
  color: #c4a882;
  margin-top: 5px;
  letter-spacing: 1px;
}
.sc-emojis {
  display: flex;
  flex-wrap: wrap;
  gap: 5px 7px;
  justify-content: center;
  max-width: 230px;
  margin-bottom: 22px;
}
.sc-emoji-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.sc-emoji-icon { font-size: 17px; }
.sc-emoji-day  { font-size: 8px; color: #c4b098; }
.sc-closing {
  font-size: 26px;
  color: #c4756a;
  letter-spacing: 2px;
  font-weight: 500;
  margin-bottom: 18px;
  text-align: center;
}
.sc-brand {
  font-size: 9px;
  color: rgba(160,120,90,0.32);
  letter-spacing: 2px;
}
.sc-hint {
  position: absolute;
  bottom: -28px;
  font-size: 10px;
  color: rgba(245,232,216,0.18);
  letter-spacing: 2px;
}
</style>
</head>
<body>

<div id="loading">
  <span class="dot">·</span><span class="dot">·</span><span class="dot">·</span>
</div>

<button id="backBtn" onclick="goBack()" style="
  position:fixed; top:18px; left:16px; z-index:100;
  font-size:13px; letter-spacing:1px;
  color:rgba(245,232,216,0.4); background:none; border:none;
  cursor:pointer; font-family:inherit;
  transition:color 0.3s; padding:6px 4px;
">← 返回</button>

<div id="monthNav">
  <button class="nav-btn" id="prevBtn" onclick="changeMonth(-1)">‹</button>
  <div id="navLabel">—</div>
  <button class="nav-btn" id="nextBtn" onclick="changeMonth(1)">›</button>
</div>

<div id="scrollDots"></div>
<div id="report"></div>

<script>
const MONTH_CN    = ['一','二','三','四','五','六','七','八','九','十','十一','十二'];
const MONTH_NAMES = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

function beijingYM() {
  const d = new Date(Date.now() + 8 * 3600 * 1000);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;
}

let curMonth = beijingYM();

function updateNav() {
  const [y, m] = curMonth.split('-').map(Number);
  document.getElementById('navLabel').textContent = `${y} · ${MONTH_CN[m-1]}月`;
  document.getElementById('nextBtn').disabled = curMonth >= beijingYM();
}

function changeMonth(delta) {
  const [y, m] = curMonth.split('-').map(Number);
  const nd = new Date(y, m - 1 + delta, 1);
  curMonth = `${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}`;
  updateNav();
  load();
}

async function load(regen = false) {
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('report').innerHTML = '';
  document.getElementById('scrollDots').innerHTML = '';
  try {
    const r = await fetch(`/api/monthly_report?month=${curMonth}${regen ? '&regen=1' : ''}`);
    render(await r.json());
  } catch {
    document.getElementById('loading').innerHTML =
      '<span style="color:#c4756a;font-size:13px;letter-spacing:2px">加载失败，请稍后再试</span>';
  }
}

function moodScore(mood) {
  return { '很好': 4, '还行': 3, '有点累': 2, '不太好': 1 }[mood] || 0;
}

function findInsight(data, totalDays) {
  const moodData   = data.moodData   || [];
  const jarEntries = data.jarEntries || [];
  const mc         = data.moodCounts || {};
  const recorded   = moodData.length;
  if (recorded === 0) return null;

  // 全勤
  if (recorded >= totalDays) {
    return { big: '一天都没漏', detail: `${totalDays} 天，全部记录下来了` };
  }
  // 没有任何难受的天
  if ((mc['不太好'] || 0) === 0 && (mc['有点累'] || 0) === 0) {
    return { big: '每天都还好', detail: '这个月，没有一天真的很难' };
  }
  // 没有不太好的天
  if ((mc['不太好'] || 0) === 0 && recorded >= 4) {
    const tired = mc['有点累'] || 0;
    return {
      big: '一直都撑住了',
      detail: tired > 0 ? `有 ${tired} 天有点累，但没有真正倒下去` : '这个月没有很难受的时候'
    };
  }
  // 最长连续记录 ≥ 5 天
  const dates = moodData.map(e => e.date).sort();
  let maxStreak = 1, cur = 1;
  for (let i = 1; i < dates.length; i++) {
    const diff = (new Date(dates[i]) - new Date(dates[i-1])) / 86400000;
    if (diff === 1) { cur++; maxStreak = Math.max(maxStreak, cur); }
    else cur = 1;
  }
  if (maxStreak >= 5) {
    return { big: `连续 ${maxStreak} 天`, detail: '这是这个月最长的连续记录' };
  }
  // 很好的天超过一半
  const vg = mc['很好'] || 0;
  if (vg >= Math.ceil(recorded / 2) && recorded >= 4) {
    return { big: `${vg} 天很好`, detail: '超过了这个月记录天数的一半' };
  }
  // 罐子存了 ≥ 3 条
  if (jarEntries.length >= 3) {
    return { big: `${jarEntries.length} 句话`, detail: '这个月她存进了罐子' };
  }
  return null;
}

function render(data) {
  const [y, m] = data.month.split('-').map(Number);
  const monthCN   = MONTH_CN[m - 1];
  const isCurrent = data.month === beijingYM();
  const totalDays = new Date(y, m, 0).getDate();
  const recorded  = data.moodData?.length || 0;
  const mc        = data.moodCounts || {};

  // Best day：优先选「很好」且有罐子记录的天，取罐子文字最长的那条
  let bestDay = null;
  let bestDayJar = null;
  if (recorded > 0) {
    const jarMap = {};
    (data.jarEntries || []).forEach(e => {
      if (!jarMap[e.date] || e.text.length > jarMap[e.date].text.length) {
        jarMap[e.date] = e;
      }
    });

    // 1. 很好 + 有罐子，取罐子最长
    const vgWithJar = data.moodData.filter(m => m.mood === '很好' && jarMap[m.date]);
    if (vgWithJar.length > 0) {
      bestDay = vgWithJar.reduce((a, b) =>
        (jarMap[b.date]?.text?.length || 0) > (jarMap[a.date]?.text?.length || 0) ? b : a
      );
    } else {
      // 2. 任意好心情 + 有罐子，取罐子最长
      const goodWithJar = data.moodData.filter(m => moodScore(m.mood) >= 3 && jarMap[m.date]);
      if (goodWithJar.length > 0) {
        bestDay = goodWithJar.reduce((a, b) =>
          (jarMap[b.date]?.text?.length || 0) > (jarMap[a.date]?.text?.length || 0) ? b : a
        );
      } else {
        // 3. 兜底：心情最好的天
        bestDay = [...data.moodData].sort((a, b) => moodScore(b.mood) - moodScore(a.mood))[0];
      }
    }
    bestDayJar = bestDay ? (jarMap[bestDay.date] || null) : null;
  }

  // Mood summary text
  const good = (mc['很好'] || 0) + (mc['还行'] || 0);
  const bad  = (mc['有点累'] || 0) + (mc['不太好'] || 0);
  const moodSummary =
    recorded === 0         ? '这个月还没有记录' :
    good >= recorded * 0.7 ? '大多数时候，心情不错' :
    bad  >= recorded * 0.6 ? '这个月有些疲惫的时候' :
                             '心情有起有落，都是真实的你';

  // Insight
  const insight = findInsight(data, totalDays);

  const html = [];

  // ── S1 开场 ──
  html.push(`
    <section class="section s-dark">
      <div class="open-year fu">${y}</div>
      <div class="open-month fu d1">${monthCN}月</div>
      <div class="open-sub fu d2">${isCurrent ? '这个月，还在继续' : '这个月，已经过去了'}</div>
      <div class="scroll-hint">向下滑动</div>
    </section>
  `);

  // ── S2 数字 + 心情网格 合并 ──
  const sortedMoods = [...(data.moodData || [])].sort((a, b) => a.date.localeCompare(b.date));
  const gridHtml = sortedMoods.map(e => {
    const day = parseInt(e.date.split('-')[2]);
    return `<div class="mood-cell">
      <span class="mood-cell-emoji">${e.emoji}</span>
      <span class="mood-cell-day">${m}/${day}</span>
    </div>`;
  }).join('');
  const countsHtml = Object.entries(mc).filter(([, v]) => v > 0)
    .map(([k, v]) => `<span class="mood-count-pill">${k} ${v}天</span>`).join('');

  html.push(`
    <section class="section s-warm">
      <div class="merged-num-wrap fu">
        <span class="merged-num">${recorded}</span>
        <span class="merged-unit">天</span>
      </div>
      <div class="merged-sub fu d1">${monthCN}月共 ${totalDays} 天</div>
      ${recorded > 0
        ? `<div class="mood-grid fu d2">${gridHtml}</div>`
        : `<div style="color:#c4b098;font-size:13px;margin-bottom:24px;text-align:center" class="fu d2">这个月还没有记录</div>`
      }
      <div class="fu d3">
        <div class="mood-summary-text">${moodSummary}</div>
        <div class="mood-count-row">${countsHtml}</div>
      </div>
    </section>
  `);

  // ── S3 最好的那天 (conditional) ──
  if (bestDay) {
    const bd = bestDay.date.split('-').map(Number);
    html.push(`
      <section class="section s-mid-dark">
        <div class="best-pre fu">这个月最好的一天</div>
        <div class="best-date fu d1">${bd[1]}月${bd[2]}日</div>
        <span class="best-emoji fu d1">${bestDay.emoji}</span>
        ${bestDayJar
          ? `<div class="best-quote fu d2">「${bestDayJar.text}」</div>
             <div class="best-quote-note fu d3">她存进罐子的话</div>`
          : `<div class="best-quote fu d2" style="opacity:.3">那天，她过得很好</div>`
        }
      </section>
    `);
  }

  // ── S4 意外发现 (conditional) ──
  if (insight) {
    html.push(`
      <section class="section s-insight">
        <div class="insight-pre fu">注意到了</div>
        <div class="insight-big fu d1">${insight.big}</div>
        <div class="insight-detail fu d2">${insight.detail}</div>
      </section>
    `);
  }

  // ── S5 罐子 (conditional) ──
  if (data.jarEntries?.length > 0) {
    const jarHtml = data.jarEntries.map(e => {
      const d = e.date.split('-').map(Number);
      return `<div class="fu">
        <div class="jar-item-text">「${e.text}」</div>
        <div class="jar-item-date">${d[1]}月${d[2]}日</div>
      </div>`;
    }).join('');
    html.push(`
      <section class="section s-warm-alt">
        <div class="jar-wrap">
          <div class="sec-label fu">你存进罐子的话</div>
          <div class="jar-list">${jarHtml}</div>
        </div>
      </section>
    `);
  }

  // ── S6 信 ──
  html.push(`
    <section class="section s-paper">
      <div class="letter-inner">
        <div class="letter-cap fu">这个${monthCN}月，关于你</div>
        <div class="letter-body fu d1">${data.letter || ''}</div>
      </div>
    </section>
  `);

  // ── S7 结尾 ──
  const closeLine = isCurrent ? `${monthCN}月还在继续。` : `${monthCN}月过去了。`;
  html.push(`
    <section class="section s-warm">
      <div class="close-line1 fu">${closeLine}</div>
      <div class="close-line2 fu d1">你很好。</div>
      <button class="regen-btn" onclick="load(true)">重新生成</button>
    </section>
  `);

  // ── S8 截图卡 ──
  // 取最长的罐子原话作为引用
  let scJar = null;
  if (data.jarEntries?.length > 0) {
    scJar = data.jarEntries.reduce((a, b) =>
      (a.text?.length || 0) >= (b.text?.length || 0) ? a : b
    );
  }

  const scEmojiHtml = sortedMoods.slice(0, 10).map(e => {
    const day = parseInt(e.date.split('-')[2]);
    return `<div class="sc-emoji-item">
      <span class="sc-emoji-icon">${e.emoji}</span>
      <span class="sc-emoji-day">${m}/${day}</span>
    </div>`;
  }).join('');

  html.push(`
    <section class="section s-sharecard">
      <div class="sharecard-wrap fu">
        <div class="sc-header">${y}</div>
        <div class="sc-month">${monthCN}月</div>
        ${scJar ? (() => {
          const jd = scJar.date.split('-').map(Number);
          return `<div class="sc-quote-wrap">
            <div class="sc-quote-text">「${scJar.text}」</div>
            <div class="sc-quote-date">— ${jd[1]}月${jd[2]}日</div>
          </div>`;
        })() : ''}
        ${scEmojiHtml ? `<div class="sc-emojis">${scEmojiHtml}</div>` : ''}
        <div class="sc-closing">你很好。</div>
        <div class="sc-brand">刘迎春的开心小角落</div>
      </div>
      <div class="sc-hint">截图保存</div>
    </section>
  `);

  // Inject
  document.getElementById('report').innerHTML = html.join('');
  window.scrollTo(0, 0);

  // Fix indices & dots
  const sections = document.querySelectorAll('.section');
  sections.forEach((s, i) => s.dataset.idx = i);

  document.getElementById('scrollDots').innerHTML = Array.from(sections, (_, i) =>
    `<div class="s-dot${i === 0 ? ' active' : ''}" onclick="scrollToSection(${i})"></div>`
  ).join('');

  // Observer
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      entry.target.querySelectorAll('.fu').forEach(el => setTimeout(() => el.classList.add('in'), 80));
      const idx = parseInt(entry.target.dataset.idx);
      document.querySelectorAll('.s-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
      const isDark = entry.target.classList.contains('s-dark') || entry.target.classList.contains('s-mid-dark');
      setNavTheme(isDark);
    });
  }, { threshold: 0.45 });

  sections.forEach(s => observer.observe(s));
  document.getElementById('loading').style.display = 'none';
}

function scrollToSection(idx) {
  const s = document.querySelectorAll('.section')[idx];
  if (s) s.scrollIntoView({ behavior: 'smooth' });
}

function setNavTheme(dark) {
  const btns  = document.querySelectorAll('.nav-btn');
  const label = document.getElementById('navLabel');
  const dots  = document.querySelectorAll('.s-dot');
  const back  = document.getElementById('backBtn');
  if (dark) {
    btns.forEach(b => { b.style.color = 'rgba(245,232,216,0.4)'; b.style.borderColor = 'rgba(245,232,216,0.2)'; });
    label.style.color = 'rgba(245,232,216,0.35)';
    dots.forEach(d => { d.style.background = d.classList.contains('active') ? 'rgba(245,232,216,0.65)' : 'rgba(245,232,216,0.18)'; });
    if (back) back.style.color = 'rgba(245,232,216,0.35)';
  } else {
    btns.forEach(b => { b.style.color = 'rgba(196,149,106,0.55)'; b.style.borderColor = 'rgba(196,149,106,0.25)'; });
    label.style.color = 'rgba(196,149,106,0.5)';
    dots.forEach(d => { d.style.background = d.classList.contains('active') ? 'rgba(196,149,106,0.65)' : 'rgba(196,149,106,0.18)'; });
    if (back) back.style.color = 'rgba(196,149,106,0.45)';
  }
}

function goBack() {
  if (window.parent !== window) {
    window.parent.closeMonthly();
  } else {
    window.location.href = '/';
  }
}

updateNav();
load();
</script>
</body>
</html>
