<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心情月报 · 刘迎春</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  background: radial-gradient(ellipse at center, #FDF8EE 0%, #F5EDD8 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 16px 60px;
  font-family: 'Noto Serif SC', 'PingFang SC', serif;
}

/* 导航 */
.nav {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 32px;
}
.nav-btn {
  background: rgba(255,255,255,0.7);
  border: 1.5px solid rgba(196,149,106,0.28);
  border-radius: 50%;
  width: 38px; height: 38px;
  font-size: 18px;
  cursor: pointer;
  color: #c4756a;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.nav-btn:hover:not(:disabled) { background: rgba(255,240,220,0.9); }
.nav-btn:disabled { opacity: 0.2; cursor: default; }
.nav-month {
  font-size: 14px;
  color: #a07860;
  letter-spacing: 3px;
  font-family: 'Noto Serif SC', serif;
  min-width: 130px;
  text-align: center;
}

/* 卡片 */
.card {
  background: rgba(255,253,247,0.96);
  backdrop-filter: blur(12px);
  border-radius: 32px;
  padding: 40px 30px 32px;
  max-width: 400px;
  width: 100%;
  box-shadow: 0 8px 48px rgba(210,140,180,0.12), 0 2px 12px rgba(180,120,200,0.07);
  border: 1.5px solid rgba(255,200,225,0.45);
}

/* 卡片头部 */
.card-top {
  text-align: center;
  margin-bottom: 28px;
}
.card-month {
  font-size: 12px;
  color: #c4a882;
  letter-spacing: 2px;
  margin-bottom: 10px;
}
.card-dog { font-size: 22px; display: block; opacity: 0.75; }

/* 信的正文 */
.letter {
  font-size: 15px;
  color: #8a6058;
  line-height: 2.1;
  font-weight: 400;
  white-space: pre-line;
}

/* 罐子精选 */
.jar-featured {
  margin: 24px 0 0;
  padding: 4px 0 4px 18px;
  border-left: 2px solid rgba(196,149,106,0.3);
  text-align: left;
}
.jar-featured-text {
  font-size: 15px;
  color: #8a6058;
  line-height: 1.9;
  font-style: italic;
  font-family: 'Noto Serif SC', serif;
  font-weight: 400;
}
.jar-featured-date {
  font-size: 10px;
  color: #c4b098;
  margin-top: 8px;
  letter-spacing: 1px;
}

/* 分隔线 */
.trail-divider {
  width: 32px;
  height: 1px;
  background: rgba(196,149,106,0.22);
  margin: 28px auto 20px;
}
.trail-count {
  text-align: center;
  font-size: 11px;
  color: #d0b8a8;
  letter-spacing: 1px;
  margin-bottom: 14px;
}

/* 心情轨迹 */
.mood-trail {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 10px;
  justify-content: center;
  margin: 0 0 8px;
}
.mood-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}
.mood-emoji { font-size: 22px; }
.mood-date  { font-size: 9px; color: #c4b098; letter-spacing: 0.3px; }

/* 无记录时的占位 */
.mood-empty {
  text-align: center;
  font-size: 12px;
  color: #d0b8a8;
  margin: 28px 0;
  font-style: italic;
}

/* 人写的最后一行 */
.human-line {
  text-align: center;
  font-size: 17px;
  color: #c4756a;
  font-weight: 500;
  letter-spacing: 0.5px;
  margin-top: 32px;
  margin-bottom: 24px;
  font-family: 'Noto Serif SC', serif;
}

/* 底部 */
.card-footer {
  text-align: center;
}
.footer-text {
  font-size: 11px;
  color: #d0bfaf;
  letter-spacing: 1px;
}

/* 重新生成（管理员用） */
.regen-btn {
  display: block;
  margin: 22px auto 0;
  background: none;
  border: 1px solid rgba(196,149,106,0.2);
  border-radius: 20px;
  padding: 5px 18px;
  font-size: 10px;
  color: rgba(196,168,130,0.5);
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 1px;
  transition: all 0.2s;
}
.regen-btn:hover { color: #c4756a; border-color: rgba(196,149,106,0.4); }

/* 加载 */
.loading {
  text-align: center;
  padding: 72px 20px;
  color: #c4a882;
  font-size: 13px;
  letter-spacing: 2px;
}
.dot { display: inline-block; animation: blink 1.4s ease-in-out infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink {
  0%, 80%, 100% { opacity: 0.15; }
  40% { opacity: 1; }
}
</style>
</head>
<body>

<div class="nav">
  <button class="nav-btn" id="prevBtn" onclick="changeMonth(-1)">‹</button>
  <div class="nav-month" id="navMonth">—</div>
  <button class="nav-btn" id="nextBtn" onclick="changeMonth(1)">›</button>
</div>

<div class="card" id="card">
  <div class="loading"><span class="dot">·</span><span class="dot">·</span><span class="dot">·</span></div>
</div>

<script>
const MONTH_NAMES = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const MONTH_CN   = ['一','二','三','四','五','六','七','八','九','十','十一','十二'];

function beijingYM() {
  const d = new Date(Date.now() + 8 * 3600 * 1000);
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;
}

function daysInMonth(ym) {
  const [y, m] = ym.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}

let curMonth = beijingYM();

function updateNav() {
  const [y, m] = curMonth.split('-').map(Number);
  document.getElementById('navMonth').textContent = `${y}年${MONTH_NAMES[m-1]}`;
  document.getElementById('nextBtn').disabled = curMonth >= beijingYM();
}

function changeMonth(d) {
  const [y, m] = curMonth.split('-').map(Number);
  const nd = new Date(y, m - 1 + d, 1);
  curMonth = `${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}`;
  updateNav();
  load();
}

async function load(regen = false) {
  document.getElementById('card').innerHTML =
    '<div class="loading"><span class="dot">·</span><span class="dot">·</span><span class="dot">·</span></div>';
  try {
    const r = await fetch(`/api/monthly_report?month=${curMonth}${regen?'&regen=1':''}`);
    render(await r.json());
  } catch {
    document.getElementById('card').innerHTML =
      '<div class="loading" style="color:#c4756a">加载失败，请稍后再试</div>';
  }
}

function render(data) {
  const [y, m] = data.month.split('-').map(Number);
  const monthCN  = MONTH_CN[m-1];
  const monthFull = `${y}年${MONTH_NAMES[m-1]}`;
  const isCurrent = data.month === beijingYM();

  // 心情轨迹
  let trailHtml = '';
  if (data.moodData?.length > 0) {
    trailHtml = [...data.moodData].reverse().map(e => {
      const day = parseInt(e.date.split('-')[2]);
      return `<div class="mood-item">
        <span class="mood-emoji">${e.emoji}</span>
        <span class="mood-date">${m}/${day}</span>
      </div>`;
    }).join('');
  } else {
    trailHtml = `<div class="mood-empty">这个月还没有记录心情</div>`;
  }

  // 最后一行（人写的）
  const humanLine = isCurrent
    ? `${monthCN}月还在继续。你很好。`
    : `${monthCN}月过去了。你很好。`;

  const footerText = isCurrent ? '本月数据截至今日' : `${monthFull}`;

  // 取最长的一条罐子内容作为精选
  let featuredJar = null;
  if (data.jarEntries?.length > 0) {
    featuredJar = data.jarEntries.reduce((a, b) =>
      (a.text?.length || 0) >= (b.text?.length || 0) ? a : b
    );
  }
  let jarHtml = '';
  if (featuredJar) {
    const jd = featuredJar.date.split('-').map(Number);
    const jLabel = `${jd[1]}月${jd[2]}日`;
    jarHtml = `
      <div class="jar-featured">
        <div class="jar-featured-text">「${featuredJar.text}」</div>
        <div class="jar-featured-date">— ${jLabel}</div>
      </div>`;
  }

  document.getElementById('card').innerHTML = `
    <div class="card-top">
      <div class="card-month">${monthFull}</div>
      <span class="card-dog">🐾</span>
    </div>

    <div class="letter">${data.letter || ''}</div>

    ${jarHtml}

    ${data.moodData?.length > 0 ? `
      <div class="trail-divider"></div>
      <div class="trail-count">这个月，你记录了 ${data.moodData.length} 天</div>
      <div class="mood-trail">${trailHtml}</div>
    ` : `<div class="mood-empty">这个月还没有记录心情</div>`}

    <div class="human-line">${humanLine}</div>

    <div class="card-footer">
      <div class="footer-text">${footerText}</div>
    </div>

    <button class="regen-btn" onclick="load(true)">重新生成</button>
  `;
}

updateNav();
load();
</script>
</body>
</html>
