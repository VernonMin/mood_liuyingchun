<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心情月报 · 刘迎春</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  background: radial-gradient(ellipse at center, #FDF8EE 0%, #F5EDD8 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 36px 16px 56px;
  font-family: 'Noto Serif SC', 'PingFang SC', serif;
}

/* 月份导航 */
.nav {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 28px;
}

.nav-btn {
  background: rgba(255,255,255,0.75);
  border: 1.5px solid rgba(196,149,106,0.3);
  border-radius: 50%;
  width: 38px; height: 38px;
  font-size: 18px;
  cursor: pointer;
  color: #c4756a;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  line-height: 1;
}
.nav-btn:hover:not(:disabled) { background: rgba(255,240,220,0.9); }
.nav-btn:disabled { opacity: 0.25; cursor: default; }

.nav-month {
  font-size: 15px;
  color: #9a6860;
  letter-spacing: 2px;
  font-family: 'Noto Serif SC', serif;
  min-width: 130px;
  text-align: center;
}

/* 卡片 */
.card {
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  border-radius: 28px;
  padding: 36px 28px 28px;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 8px 40px rgba(220,150,200,0.15), 0 2px 12px rgba(180,130,220,0.08);
  border: 1.5px solid rgba(255,200,230,0.5);
}

/* 卡片头部 */
.card-header {
  text-align: center;
  margin-bottom: 28px;
}
.card-month-label {
  font-size: 12px;
  color: #c4a882;
  letter-spacing: 3px;
  margin-bottom: 8px;
}
.card-title {
  font-size: 18px;
  color: #c4756a;
  font-weight: 400;
  letter-spacing: 3px;
}
.card-dog {
  font-size: 26px;
  margin-top: 12px;
  display: block;
}

/* 分割线 */
.divider {
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(220,180,180,0.35), transparent);
  margin: 22px 0;
}

/* AI 开场白 */
.ai-opening {
  font-size: 14px;
  color: #9a6860;
  line-height: 2;
  font-weight: 400;
}

/* 小标题 */
.section-label {
  font-size: 11px;
  color: #c4a882;
  letter-spacing: 2px;
  margin-bottom: 14px;
}

/* 心情格子 */
.mood-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 14px;
}
.mood-day {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  border-radius: 9px;
  background: rgba(253,246,236,0.8);
  border: 1px solid rgba(224,200,196,0.35);
}
.mood-day.empty {
  font-size: 11px;
  color: rgba(196,168,130,0.3);
}
.mood-stats {
  display: flex;
  gap: 14px;
  font-size: 12px;
  color: #c4a882;
  flex-wrap: wrap;
}
.mood-stats strong { color: #c4756a; font-weight: 600; }

/* 罐子内容 */
.jar-list { display: flex; flex-direction: column; gap: 10px; }
.jar-item {
  background: rgba(253,248,230,0.7);
  border-radius: 12px;
  padding: 11px 14px;
  border: 1px solid rgba(224,200,160,0.35);
}
.jar-text { font-size: 13px; color: #6a4848; line-height: 1.8; }
.jar-date { font-size: 10px; color: #c4a882; margin-top: 5px; }
.jar-empty {
  font-size: 12px; color: #c4a882;
  font-style: italic; text-align: center; padding: 6px 0;
}

/* AI 寄语 */
.ai-closing {
  font-size: 14px;
  color: #9a6860;
  line-height: 2;
  text-align: center;
  font-style: italic;
}

/* 底部 */
.card-footer { text-align: center; margin-top: 22px; }
.footer-text { font-size: 12px; color: #c4a882; letter-spacing: 1px; }
.footer-dog { font-size: 24px; margin-top: 8px; display: block; }

/* 当月提示 */
.progress-note {
  text-align: center;
  font-size: 11px;
  color: rgba(196,168,130,0.7);
  margin-top: 14px;
  font-style: italic;
}

/* 重新生成按钮 */
.regen-btn {
  display: block;
  margin: 18px auto 0;
  background: none;
  border: 1px solid rgba(196,149,106,0.25);
  border-radius: 20px;
  padding: 5px 18px;
  font-size: 11px;
  color: rgba(196,168,130,0.7);
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 1px;
  transition: all 0.2s;
}
.regen-btn:hover { color: #c4756a; border-color: rgba(196,149,106,0.5); }

/* 加载 & 空状态 */
.loading {
  text-align: center;
  padding: 64px 20px;
  color: #c4a882;
  font-size: 13px;
  letter-spacing: 2px;
}
.loading-dot {
  display: inline-block;
  animation: blink 1.2s ease-in-out infinite;
}
.loading-dot:nth-child(2) { animation-delay: 0.2s; }
.loading-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink {
  0%, 80%, 100% { opacity: 0.2; }
  40% { opacity: 1; }
}
</style>
</head>
<body>

<div class="nav">
  <button class="nav-btn" id="prevBtn" onclick="changeMonth(-1)">‹</button>
  <div class="nav-month" id="navMonth">—</div>
  <button class="nav-btn" id="nextBtn" onclick="changeMonth(1)">›</button>
</div>

<div class="card" id="card">
  <div class="loading">
    <span class="loading-dot">·</span>
    <span class="loading-dot">·</span>
    <span class="loading-dot">·</span>
  </div>
</div>

<script>
const MONTH_NAMES = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

function getBeijingYearMonth() {
  const d = new Date(Date.now() + 8 * 3600 * 1000);
  const y = d.getUTCFullYear();
  const m = String(d.getUTCMonth() + 1).padStart(2, '0');
  return `${y}-${m}`;
}

function getDaysInMonth(yearMonth) {
  const [y, m] = yearMonth.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}

function formatDate(dateStr) {
  const parts = dateStr.split('-');
  return `${parseInt(parts[1])}月${parseInt(parts[2])}日`;
}

let currentMonth = getBeijingYearMonth();

function updateNav() {
  const [y, m] = currentMonth.split('-').map(Number);
  document.getElementById('navMonth').textContent = `${y}年${MONTH_NAMES[m - 1]}`;
  const today = getBeijingYearMonth();
  document.getElementById('nextBtn').disabled = currentMonth >= today;
}

function changeMonth(delta) {
  const [y, m] = currentMonth.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  currentMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  updateNav();
  loadReport();
}

async function loadReport(regen = false) {
  document.getElementById('card').innerHTML = `
    <div class="loading">
      <span class="loading-dot">·</span>
      <span class="loading-dot">·</span>
      <span class="loading-dot">·</span>
    </div>`;

  try {
    const url = `/api/monthly_report?month=${currentMonth}${regen ? '&regen=1' : ''}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error();
    const data = await res.json();
    renderReport(data);
  } catch (e) {
    document.getElementById('card').innerHTML =
      '<div class="loading" style="color:#c4756a">加载失败，请稍后再试</div>';
  }
}

function renderReport(data) {
  const [y, m] = data.month.split('-').map(Number);
  const monthName = `${y}年${MONTH_NAMES[m - 1]}`;
  const daysInMonth = getDaysInMonth(data.month);

  // 心情格子
  const moodMap = {};
  (data.moodData || []).forEach(entry => {
    moodMap[parseInt(entry.date.split('-')[2])] = entry.emoji;
  });
  let gridHtml = '';
  for (let d = 1; d <= daysInMonth; d++) {
    gridHtml += moodMap[d]
      ? `<div class="mood-day" title="${d}日">${moodMap[d]}</div>`
      : `<div class="mood-day empty">·</div>`;
  }

  // 统计
  const total = data.moodData?.length || 0;
  const dominant = data.dominantMood || '';
  const emojiMap = { '很好': '😊', '还行': '🙂', '有点累': '😴', '不太好': '😔' };

  // 罐子
  let jarHtml = '';
  if (data.jarEntries?.length > 0) {
    jarHtml = data.jarEntries.slice(0, 3).map(e =>
      `<div class="jar-item">
        <div class="jar-text">「${e.text}」</div>
        <div class="jar-date">${formatDate(e.date)}</div>
      </div>`
    ).join('');
  } else {
    jarHtml = '<div class="jar-empty">这个月没有存好心情进罐子</div>';
  }

  const isCurrentMonth = data.month === getBeijingYearMonth();
  const footerText = isCurrentMonth ? `${monthName}还在继续` : `${monthName}已经过去了`;

  document.getElementById('card').innerHTML = `
    <div class="card-header">
      <div class="card-month-label">${monthName}</div>
      <div class="card-title">刘迎春的心情月报</div>
      <span class="card-dog">🐾</span>
    </div>

    <div class="ai-opening">${data.aiText?.opening || ''}</div>

    <div class="divider"></div>

    <div>
      <div class="section-label">这个月的心情</div>
      <div class="mood-grid">${gridHtml}</div>
      <div class="mood-stats">
        记录了 <strong>${total}</strong> 天
        ${dominant ? `&nbsp;·&nbsp; 最常出现 <strong>${emojiMap[dominant] || ''} ${dominant}</strong>` : ''}
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-label">存进罐子的</div>
      <div class="jar-list">${jarHtml}</div>
    </div>

    <div class="divider"></div>

    <div class="ai-closing">${data.aiText?.closing || ''}</div>

    <div class="card-footer">
      <div class="footer-text">${footerText} · 下个月也好好的</div>
      <span class="footer-dog">🐾</span>
    </div>

    ${isCurrentMonth ? '<div class="progress-note">本月数据截至今日</div>' : ''}

    <button class="regen-btn" onclick="loadReport(true)">重新生成</button>
  `;
}

updateNav();
loadReport();
</script>

</body>
</html>
